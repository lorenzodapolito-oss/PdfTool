[package]
name = "pdftool"
version = "1.0.0"
edition = "2021"
description = "PdfTool - EPUB, fumetti (CBZ/CBR/CB7) e immagini in PDF, e PDF in immagini"
authors = ["Lorenzo D'Apolito"]
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
chrono = "0.4"
krilla = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
scraper = "0.22"
ttf-parser = "0.25"
hayro = "0.4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
